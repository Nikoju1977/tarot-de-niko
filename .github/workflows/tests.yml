name: Tests du Tarot
on:
  push:
    branches:
      - main
      - fix/**
  pull_request:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier les modules ES
        run: npm run check
      - name: Tests de régression
        run: npm test
