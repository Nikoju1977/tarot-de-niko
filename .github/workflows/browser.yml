name: Parcours navigateur V2
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Playwright
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Servir le site statique
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/oracle-http.log 2>&1 &
          sleep 2
      - name: Vérifier les parcours dans Chromium
        run: node tests-browser.mjs
